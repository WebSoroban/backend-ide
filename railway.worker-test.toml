# Railway config for the TEST worker service (runs `cargo test`).
#
# Point the worker-test service at this file:
#   Service → Settings → Config-as-code → Railway Config File = railway.worker-test.toml
#
# No healthcheckPath: workers don't run an HTTP server, so a health check would
# fail and restart them in a loop.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfiles/Dockerfile.worker"

[deploy]
startCommand = "node dist/workers/testWorker.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
