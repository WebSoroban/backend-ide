# Railway config for the AI Copilot AGENT worker service.
#
# Runs the agent tool loop (workers/agentWorker.ts). It needs the same toolchain
# image as the build workers because its validation loop invokes
# `stellar contract build` / `cargo test` / `cargo clippy` in-process, plus
# OPENROUTER_API_KEY (and the shared REDIS_URL) set on the service.
#
# Point the worker-agent service at this file:
#   Service → Settings → Config-as-code → Railway Config File = railway.worker-agent.toml
#
# No healthcheckPath: workers don't run an HTTP server, so a health check would
# fail and restart them in a loop.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfiles/Dockerfile.worker"

[deploy]
startCommand = "node dist/workers/agentWorker.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
