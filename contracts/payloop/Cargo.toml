[package]
name = "payloop"
version = "0.1.0"
edition = "2021"
description = "Non-custodial USDC subscriptions on Soroban: policy-bound recurring charges from the subscriber's own wallet"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "29.0.0"

[dev-dependencies]
soroban-sdk = { version = "29.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
