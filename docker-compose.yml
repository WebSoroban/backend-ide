services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.api
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./temp:/app/temp
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  worker-compile:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.worker
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_TYPE=compile
      - COMPILE_WORKER_CONCURRENCY=${COMPILE_WORKER_CONCURRENCY:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./temp:/app/temp
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  worker-deploy:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.worker
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_TYPE=deploy
      - DEPLOY_WORKER_CONCURRENCY=${DEPLOY_WORKER_CONCURRENCY:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./temp:/app/temp
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  worker-test:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.worker
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_TYPE=test
      - TEST_WORKER_CONCURRENCY=${TEST_WORKER_CONCURRENCY:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./temp:/app/temp
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  # AI Copilot agent worker. Uses the same toolchain image as the build workers
  # because the agent's validation loop runs `stellar contract build` / `cargo
  # test` / `cargo clippy` in-process. Needs OPENROUTER_API_KEY (from .env).
  worker-agent:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.worker
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_TYPE=agent
      - AGENT_WORKER_CONCURRENCY=${AGENT_WORKER_CONCURRENCY:-4}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./temp:/app/temp
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  compiler:
    build:
      context: .
      dockerfile: Dockerfile
    image: websoroban-compiler:latest
    container_name: websoroban-compiler
    volumes:
      - ./temp:/workspace/temp
    profiles:
      - build-only

volumes:
  redis_data:
